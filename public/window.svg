<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">MOFHAF — Two Names. One Vision.</title>
  <desc id="desc">Gold and silver interlocking MH monogram above the MOFHAF wordmark.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a5"/><stop offset=".24" stop-color="#ffd65e"/><stop offset=".52" stop-color="#c88717"/><stop offset=".76" stop-color="#ffcf45"/><stop offset="1" stop-color="#9d5b08"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#d8d9dc"/><stop offset=".72" stop-color="#f8f8f8"/><stop offset="1" stop-color="#aeb2b8"/></linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#704008"/><stop offset="1" stop-color="#b87912"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="1000" fill="#050505"/>
  <g transform="translate(0 5)">
    <!-- subtle grounding shadow -->
    <ellipse cx="600" cy="620" rx="250" ry="24" fill="#000" opacity=".55" filter="url(#shadow)"/>
    <!-- silver H uprights -->
    <path d="M680 270 L755 212 L755 550 L680 606 Z" fill="url(#silver)"/>
    <path d="M820 210 L895 152 L895 545 L820 602 Z" fill="url(#silver)"/>
    <path d="M680 606 L755 550 L755 580 L680 635 Z" fill="#858990" opacity=".7"/>
    <path d="M820 602 L895 545 L895 574 L820 630 Z" fill="#8b8e94" opacity=".65"/>
    <!-- angular gold M -->
    <path d="M300 150 L470 282 L600 180 L600 335 L535 382 L430 297 L430 480 L360 535 L300 490 Z" fill="url(#goldSide)"/>
    <path d="M300 150 L470 282 L535 330 L470 378 L365 293 L365 485 L300 440 Z" fill="url(#gold)"/>
    <path d="M470 282 L600 180 L600 335 L535 382 L535 315 Z" fill="url(#gold)"/>
    <path d="M300 440 L365 485 L365 515 L300 470 Z" fill="#8f570d"/>
    <!-- flowing gold ribbon crossing the H -->
    <path d="M445 438 C510 430 565 382 632 335 C690 294 746 270 786 274 C817 277 833 296 843 316 C805 303 770 315 727 340 C654 382 590 443 535 452 C501 458 470 451 445 438 Z" fill="url(#gold)"/>
    <path d="M445 438 C500 450 548 432 590 406 C652 369 711 322 763 306 C797 296 824 304 843 316 C810 288 792 277 770 276 C717 272 655 317 603 355 C542 399 495 431 445 438 Z" fill="#ffe07b" opacity=".35"/>
    <!-- wordmark -->
    <g font-family="Montserrat, Arial, sans-serif" font-size="112" font-weight="500" letter-spacing="20">
      <text x="150" y="780" fill="url(#silver)">MOF</text><text x="635" y="780" fill="url(#gold)">HAF</text>
    </g>
    <!-- tagline rules and tagline -->
    <path d="M165 842 H260 M940 842 H1035" stroke="url(#gold)" stroke-width="5"/>
    <text x="600" y="854" text-anchor="middle" fill="url(#silver)" font-family="Montserrat, Arial, sans-serif" font-size="29" font-weight="400" letter-spacing="10">TWO NAMES. ONE VISION.</text>
  </g>
</svg>
